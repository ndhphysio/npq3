<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NPQ 頸部疼痛問卷</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","Microsoft JhengHei",Roboto,sans-serif;
  background:#1e3d59;
  color:#fff;
  overflow-x:hidden;
}

/* ── Audio unlock overlay ── */
#speech-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.88);
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  z-index:1000;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
#speech-overlay .tap-icon{
  font-size:6rem;margin-bottom:1.5rem;
  animation:pulse 1.4s ease-in-out infinite;
}
#speech-overlay .tap-text{font-size:2.8rem;font-weight:bold;}
#speech-overlay .tap-sub{font-size:1.3rem;margin-top:.8rem;opacity:.7;}
@keyframes pulse{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.18);opacity:.65}
}

/* ── App container ── */
#app{
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;
  padding:1rem .7rem 2rem;
}

/* ── Header ── */
.header-title{font-size:1.8rem;font-weight:bold;text-align:center;margin-top:.4rem;}
.header-sub{font-size:1.1rem;text-align:center;opacity:.75;margin-top:.2rem;margin-bottom:.8rem;}

/* ── Progress ── */
#progress-area{width:100%;max-width:700px;margin-bottom:1rem;}
#progress-text{font-size:1.6rem;font-weight:bold;text-align:center;margin-bottom:.5rem;}
#progress-bar-bg{width:100%;height:12px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden;}
#progress-bar-fill{height:100%;width:0;background:#17b978;border-radius:6px;transition:width .4s ease;}

/* ── Question card ── */
#question-card{
  background:#fff;color:#222;border-radius:16px;
  padding:1.6rem 1.2rem 1rem;
  width:100%;max-width:700px;text-align:center;
  box-shadow:0 8px 32px rgba(0,0,0,.3);
  margin-bottom:1.2rem;
}
#question-number{font-size:1.2rem;color:#999;margin-bottom:.35rem;font-weight:bold;}
#question-text{font-size:2rem;font-weight:bold;line-height:1.75;}

/* ── Button row ── */
.btn-row{
  display:flex;justify-content:center;gap:.6rem;margin-top:1rem;flex-wrap:wrap;
}
.card-btn{
  display:inline-flex;align-items:center;gap:.3rem;
  padding:.6rem 1.8rem;
  background:#ececec;color:#555;border:none;border-radius:25px;
  font-size:1.3rem;cursor:pointer;transition:background .2s;
  -webkit-tap-highlight-color:transparent;
}
.card-btn:hover{background:#ddd;}
.card-btn.active{background:#ffeaa7;color:#856404;}
#prev-btn{display:none;background:#dfe6e9;color:#2d3436;}
#prev-btn:hover{background:#b2bec3;}

/* ── Explanation panel (question level) ── */
#explanation-panel{
  display:none;
  background:#fff9e6;border:2px solid #f0d060;border-radius:12px;
  padding:1.2rem 1rem;margin-top:1rem;text-align:left;
  animation:fadeSlideDown .3s ease;
}
@keyframes fadeSlideDown{
  from{opacity:0;transform:translateY(-10px);}
  to{opacity:1;transform:translateY(0);}
}
.explain-text{font-size:1.4rem;line-height:1.8;color:#333;}
.explain-listen-btn{
  display:inline-flex;align-items:center;gap:.3rem;
  margin-top:.8rem;padding:.4rem 1.2rem;
  background:#f0d060;color:#6b5900;border:none;border-radius:20px;
  font-size:1.1rem;cursor:pointer;transition:background .2s;
  -webkit-tap-highlight-color:transparent;
}
.explain-listen-btn:hover{background:#e6c340;}

/* ── Answers area ── */
#answers-area{
  width:100%;max-width:700px;
  display:grid;grid-template-columns:1fr;gap:.75rem;
}

/* ── Option wrapper ── */
.option-wrapper{display:flex;flex-direction:column;}
.option-main-row{display:flex;gap:.5rem;}
.option-main-row .answer-btn{flex:1;}
.option-explain-btn{
  min-width:3.5rem;padding:0 0.6rem;border:none;border-radius:14px;
  background:#f0d060;color:#6b5900;font-size:1.2rem;font-weight:bold;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:0.2rem;
  transition:background .2s,transform .15s;
  box-shadow:0 5px 0 rgba(0,0,0,.15);
  -webkit-tap-highlight-color:transparent;
  flex-shrink:0;
  white-space:nowrap;
}
.option-explain-btn:hover{background:#e6c340;}
.option-explain-btn:active{transform:scale(.96);}
.option-explain-btn.active{background:#ffd000;box-shadow:0 0 0 3px #fff,0 5px 0 rgba(0,0,0,.15);}

.option-explain-panel{
  display:none;
  background:#fff9e6;border:2px solid #f0d060;border-radius:10px;
  padding:.8rem 1rem;margin-top:.4rem;text-align:left;
  animation:fadeSlideDown .3s ease;
}
.option-explain-panel .explain-text{font-size:1.2rem;line-height:1.7;}
.option-explain-panel .explain-listen-btn{
  margin-top:.5rem;padding:.3rem 1rem;font-size:1rem;
}

/* ── Answer buttons ── */
.answer-btn{
  border:none;border-radius:14px;
  padding:1.2rem 1rem;
  font-size:1.5rem;font-weight:bold;
  color:#fff;cursor:pointer;
  transition:transform .15s,opacity .15s,box-shadow .3s,filter .3s;
  box-shadow:0 5px 0 rgba(0,0,0,.22);
  text-align:center;user-select:none;
  -webkit-tap-highlight-color:transparent;
  min-height:4.2rem;
  display:flex;align-items:center;justify-content:center;
  gap:0.5rem;position:relative;
}
.answer-btn:active:not(.locked){transform:scale(.96);}
.answer-btn.locked{pointer-events:none;opacity:.35;filter:grayscale(.3);}
.answer-btn.selected{
  transform:scale(1.04);opacity:1!important;filter:none!important;
  box-shadow:0 0 0 5px #fff,0 5px 0 rgba(0,0,0,.22);
}

.answer-btn.glow{
  animation:glowPulse .7s ease-in-out infinite alternate;
  z-index:10;transform:scale(1.04);
}
@keyframes glowPulse{
  0%{
    box-shadow:0 0 12px rgba(255,255,255,0.6),0 0 24px rgba(255,255,255,0.3),0 5px 0 rgba(0,0,0,.22);
    filter:brightness(1.15);
  }
  100%{
    box-shadow:0 0 24px rgba(255,255,255,1),0 0 48px rgba(255,255,255,0.5),0 0 72px rgba(255,255,255,0.2),0 5px 0 rgba(0,0,0,.22);
    filter:brightness(1.35);
  }
}

.clr-gray{background:#546e7a;}
.clr-green{background:#26890c;}
.clr-blue{background:#1368ce;}
.clr-gold{background:#d89e00;}
.clr-orange{background:#e67e22;}
.clr-red{background:#e21b3c;}
.clr-deep-red{background:#b71c1c;}

/* ── Result screen ── */
#result-screen{display:none;width:100%;max-width:700px;text-align:center;}
.result-card{
  background:#fff;color:#333;border-radius:16px;
  padding:2rem 1.4rem;
  box-shadow:0 8px 32px rgba(0,0,0,.3);
  margin-bottom:1.5rem;
}
.result-msg{font-size:1.6rem;line-height:1.9;margin-bottom:1.8rem;text-align:left;}
.result-scores{font-size:2.4rem;font-weight:bold;color:#1e3d59;}
.result-scores span{display:block;margin:.5rem 0;}
.result-credit{font-size:1rem;color:#aaa;margin-top:1.4rem;}
#restart-btn{
  padding:1.2rem 3rem;background:#17b978;color:#fff;
  border:none;border-radius:30px;font-size:1.8rem;font-weight:bold;
  cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15);
  transition:background .2s;
  -webkit-tap-highlight-color:transparent;
}
#restart-btn:hover{background:#129661;}

#quiz-area{width:100%;display:flex;flex-direction:column;align-items:center;}

@media(min-width:600px){
  #question-text{font-size:2.2rem;}
  .answer-btn{font-size:1.7rem;padding:1.4rem 1.2rem;}
  .result-msg{font-size:1.8rem;}
  .result-scores{font-size:2.8rem;}
  .explain-text{font-size:1.6rem;}
  .option-explain-panel .explain-text{font-size:1.4rem;}
}
</style>
</head>
<body>

<div id="speech-overlay">
  <div class="tap-icon">🔊</div>
  <div class="tap-text">點按以啟用語音</div>
  <div class="tap-sub">Tap to enable voice</div>
</div>

<div id="app">
  <div class="header-title">NPQ 頸部疼痛問卷</div>
  <div class="header-sub">新界東醫院聯網物理治療部</div>

  <div id="quiz-area">
    <div id="progress-area">
      <div id="progress-text"></div>
      <div id="progress-bar-bg"><div id="progress-bar-fill"></div></div>
    </div>

      <div id="question-text"></div>

        <button class="card-btn" id="replay-btn">🔊 重播</button>
        <button class="card-btn" id="explain-btn">💡 解釋</button>
      </div>
      <div id="explanation-panel">
        <div class="explain-text" id="explain-text"></div>
        <button class="explain-listen-btn" id="explain-listen-btn">🔊 再聽一次解釋</button>
      </div>
    </div>
    <div id="answers-area"></div>
  </div>

  <div id="result-screen">
    <div class="result-card">
      <div class="result-msg" id="result-msg"></div>
      <div class="result-scores" id="result-scores"></div>
      <div class="result-credit">新界東醫院聯網物理治療部製作</div>
    </div>
    <button id="restart-btn">🔄 重新開始</button>
  </div>
</div>

<script>
(function(){
  'use strict';

  var questions = [
    {
      id: 1,
      text: '現在頸痛的程度',
      explanation: '呢題想問你依家條頸痛得有幾勁？係完全唔痛、有少少溫和咁痛、中等程度、好厲害，定係痛到簡直難以想像？',
      options: [
        { label: '沒有頸痛', value: 0, explanation: '條頸依家完全唔痛。' },
        { label: '溫和', value: 1, explanation: '有少少頸痛，但唔算太嚴重。' },
        { label: '中等', value: 2, explanation: '頸痛情況明顯，但仲可以忍受。' },
        { label: '很厲害', value: 3, explanation: '頸痛好犀利，好難受。' },
        { label: '簡直不可想像', value: 4, explanation: '痛到簡直無法想像，非常嚴重。' }
      ]
    },
    {
      id: 2,
      text: '頸痛與睡眠',
      explanation: '想問你條頸痛會唔會影響你瞓覺？例如有冇試過因為痛而瞓唔好、或者每晚瞓少咗？',
      options: [
        { label: '頸痛從不干擾我睡眠', value: 0, explanation: '瞓覺完全冇受頸痛影響。' },
        { label: '頸痛有時會干擾我睡眠', value: 1, explanation: '間唔中會因為頸痛而影響睡眠。' },
        { label: '頸痛經常會干擾我睡眠', value: 2, explanation: '經常因為頸痛而瞓得差。' },
        { label: '頸痛使我每晚睡眠少於五小時', value: 3, explanation: '因為頸痛，搞到每晚瞓唔夠五個鐘。' },
        { label: '頸痛使我每晚睡眠少於兩小時', value: 4, explanation: '痛到每晚瞓唔夠兩個鐘，嚴重影響休息。' }
      ]
    },
    {
      id: 3,
      text: '手臂在夜晚感到發麻或針刺般的情況',
      explanation: '呢題想問你夜晚瞓覺嗰陣，隻手臂或者手指有冇試過覺得痺、好似針拮咁？有冇影響到睡眠？',
      options: [
        { label: '我在夜晚並不感到手臂發麻或有針刺般的感覺', value: 0, explanation: '夜晚手臂冇發麻或針拮嘅感覺。' },
        { label: '我有時會在夜晚覺得手臂發麻或有針刺般的感覺', value: 1, explanation: '間唔中夜晚會覺得手臂有少少痺或針拮。' },
        { label: '手臂在夜晚發麻或針刺般的感覺經常干擾我睡眠', value: 2, explanation: '手臂發痺情況成日影響我瞓覺。' },
        { label: '手臂在夜晚發麻或針刺般的感覺使我每晚的睡眠時間少於五小時', value: 3, explanation: '因為手臂發痺，搞到每晚瞓唔夠五個鐘。' },
        { label: '我的手臂發麻或針刺般的感覺使我每晚的睡眠時間少於兩小時', value: 4, explanation: '手臂痺到每晚瞓唔夠兩個鐘。' }
      ]
    },
    {
      id: 4,
      text: '每天症狀持續的時間',
      explanation: '想問你一日入面，條頸同手臂唔舒服嘅情況持續幾耐？係起身唔舒服一陣，定係全日都有？',
      options: [
        { label: '我的頸部和手臂整天都覺得很正常', value: 0, explanation: '全日條頸同手臂都好正常，冇唔舒服。' },
        { label: '我起床時會覺得頸部和手臂有不適的症狀，但不超過一小時', value: 1, explanation: '朝早起身有少少唔舒服，但一個鐘內就冇事。' },
        { label: '頸部和手臂不適的症狀時有時無，總共持續一至四小時', value: 2, explanation: '唔舒服嘅時間時有時無，加埋大約一到四個鐘。' },
        { label: '頸部和手臂不適的症狀時有時無，總共持續超過四小時', value: 3, explanation: '唔舒服嘅時間加埋超過四個鐘。' },
        { label: '頸部和手臂不適的症狀持續不斷，整天都有', value: 4, explanation: '全日由朝到晚都有唔舒服嘅感覺。' }
      ]
    },
    {
      id: 5,
      text: '攜帶物件',
      explanation: '呢題想問你拎重嘢（例如 5 公斤或以上嘅物件）嗰陣，條頸會唔會痛？定係拎唔到重嘢？',
      options: [
        { label: '我可攜帶重物（5公斤或以上）而不感到額外的痛楚', value: 0, explanation: '拎 5 公斤或以上嘅重物完全冇問題，又唔會額外加劇痛楚。' },
        { label: '我可攜帶重物（5公斤或以上），但這令我感到額外的痛楚', value: 1, explanation: '雖然拎到重物，但會令條頸痛多咗。' },
        { label: '痛楚令我不能攜帶重物，但若物件的重量中等（約 2-3 公斤），我便可以應付', value: 2, explanation: '太重拎唔到，但 2 至 3 公斤嘅中等重量物件還可以應付。' },
        { label: '我只可以拿起輕的物件（2公斤以下）', value: 3, explanation: '只拎得起 2 公斤以下嘅輕嘢。' },
        { label: '我甚麼東西都拿不起來', value: 4, explanation: '痛到咩嘢都拎唔起。' }
      ]
    },
    {
      id: 6,
      text: '閱讀及看電視',
      explanation: '想問你睇書或者睇電視嗰陣，條頸會唔會覺得唔舒服或者受影響？',
      options: [
        { label: '多久都可以，沒有任何困難', value: 0, explanation: '睇幾耐書或電視都得，完全冇困難。' },
        { label: '如果我的姿勢適當，多久都可以', value: 1, explanation: '只要坐姿啱，睇幾耐都冇問題。' },
        { label: '多久都可以，但會產生額外的痛楚', value: 2, explanation: '雖然睇到咁耐，但會引起額外痛楚。' },
        { label: '痛楚使我不願意地提早結束這些活動', value: 3, explanation: '因為頸痛，搞到被迫提早停低唔睇。' },
        { label: '痛楚使我根本無法閱讀及看電視', value: 4, explanation: '痛到根本冇辦法睇書或者睇電視。' }
      ]
    },
    {
      id: 7,
      text: '工作、家務之類',
      explanation: '呢題問你有冇影響到你平日嘅工作或者家務？例如做唔做到平時嘅份量？',
      options: [
        { label: '我可做平時的工作而不感到額外的痛楚', value: 0, explanation: '做平時嘅工作同家務完全冇問題，又唔會痛多咗。' },
        { label: '我可做平時的工作，但這使我感到額外的痛楚', value: 1, explanation: '做到平時嘅工作，但會覺得痛咗。' },

        { label: '痛楚使我只能做平時工作量的四分之一或以下', value: 3, explanation: '只能做到平時四分一或者更少嘅工作量。' },
        { label: '痛楚使我根本無法工作', value: 4, explanation: '痛到完全冇辦法做任何工作或家務。' }
      ]
    },
    {
      id: 8,
      text: '社交活動',
      explanation: '想問你嘅社交生活有冇受頸痛影響？例如出街見朋友、聚會等有冇減少？',
      options: [
        { label: '我的社交生活正常，並不導致額外的痛楚', value: 0, explanation: '社交生活一切正常，又唔會令條頸痛多咗。' },
        { label: '我的社交生活正常，但會增加痛的程度', value: 1, explanation: '社交活動如常，但會令痛楚加劇。' },
        { label: '頸痛規限了我的社交生活，但我仍可外出活動', value: 2, explanation: '社交受到一定限制，但仍然可以出街。' },
        { label: '頸痛使我的社交生活只能限於居所之內', value: 3, explanation: '痛到只能留喺屋企，出唔到去社交。' },
        { label: '頸痛使我沒有社交生活', value: 4, explanation: '完全冇晒任何社交生活。' }
      ]
    },
    {
      id: 9,
      text: '駕駛',
      explanation: '呢題想問你揸車受唔受頸痛影響？（如果平時健康時都唔會揸車，請揀第一個選項）',
      options: [
        { label: '我連健康時也不駕駛', value: 'skip', explanation: '你平時健康時都唔會揸車（此題將不計分並自動略過）。' },
        { label: '我有需要便可以駕駛，不會感到不適', value: 0, explanation: '想揸車就揸車，完全冇不適。' },
        { label: '我有需要便可以駕駛，但會感到不適', value: 1, explanation: '揸到車，但會覺得有少少唔舒服。' },
        { label: '頸部的痛楚或僵直情況有時會限制我駕駛', value: 2, explanation: '頸痛或僵硬間唔中會限制咗你揸車。' },
        { label: '頸部的痛楚或僵直情況經常限制我駕駛', value: 3, explanation: '頸痛或僵硬經常令你揸唔車。' },
        { label: '頸痛症狀使我根本無法駕駛', value: 4, explanation: '痛到完全冇辦法揸車。' }
      ]
    }
  ];

  var BTN_COLORS_5 = ['clr-green', 'clr-blue', 'clr-gold', 'clr-orange', 'clr-red'];
  var BTN_COLORS_6 = ['clr-gray', 'clr-green', 'clr-blue', 'clr-gold', 'clr-orange', 'clr-deep-red'];

  var currentIndex   = 0;
  var answers        = {};
  var skippedCount   = 0;
  var locked         = false;
  var audioEnabled   = false;
  var explanationOpen= false;
var currentAudio = null;
var inactivityTimer = null;
var audioSequenceId = 0;

  /* ═══════════════════ AUDIO FUNCTIONS (MATCHING YOUR GITHUB NAMES) ═══════════════════ */
function clearAllGlow(){
    var btns = document.querySelectorAll('.answer-btn');

    for(var i = 0; i < btns.length; i++){
        btns[i].classList.remove('glow');
    }
}

function stopInactivityTimer(){
    if(inactivityTimer !== null){
        clearTimeout(inactivityTimer);
        inactivityTimer = null;
    }
}

function startInactivityTimer(){
    stopInactivityTimer();

    inactivityTimer = setTimeout(function(){
        inactivityTimer = null;

        if(!locked && !explanationOpen){
            /*
             * Do not call startInactivityTimer() here.
             * playAudioSequence() will restart the timer
             * only after the replay has completely finished.
             */
            playQuestionAudio();
        }
    }, 20000);
}

function stopAudio(){
    /*
     * Invalidate all callbacks belonging to the previous sequence.
     * This prevents an old setTimeout(next, 300) from continuing.
     */
    audioSequenceId++;

    if(currentAudio){
        currentAudio.onended = null;
        currentAudio.onerror = null;
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
    }

    clearAllGlow();
}

function playAudio(file){
    stopAudio();
    stopInactivityTimer();

    if(!audioEnabled) return;

    currentAudio = new Audio(file);

    currentAudio.onended = function(){
        currentAudio = null;
    };

    currentAudio.onerror = function(){
        console.log('無法載入音訊檔案:', file);
        currentAudio = null;
    };

    currentAudio.play().catch(function(error){
        console.log('播放被阻擋或出錯:', error);
        currentAudio = null;
    });
}

function playAudioSequence(files){
    stopAudio();
    stopInactivityTimer();

    if(!audioEnabled) return;

    var index = 0;
    var mySequenceId = audioSequenceId;

    function next(){
        if(mySequenceId !== audioSequenceId){
            return;
        }

        if(locked || explanationOpen){
            clearAllGlow();
            return;
        }

        if(index >= files.length){
            clearAllGlow();
            currentAudio = null;

            // Start waiting only after the complete question has finished.
            startInactivityTimer();
            return;
        }

        clearAllGlow();

        // index 0 is the question.
        // index 1 is option 1, index 2 is option 2, etc.
        if(index > 0){
            var answerBtns =
                document.querySelectorAll('.answer-btn');

            var btnIndex = index - 1;

            if(answerBtns[btnIndex]){
                answerBtns[btnIndex].classList.add('glow');
            }
        }

        var file = files[index];
        var clipFinished = false;

        currentAudio = new Audio(file);

        function finishClip(errorMessage){
            // Prevent onerror and play().catch() from both advancing.
            if(clipFinished){
                return;
            }

            clipFinished = true;

            if(mySequenceId !== audioSequenceId){
                return;
            }

            if(errorMessage){
                console.log(errorMessage, file);
            }

            clearAllGlow();
            currentAudio = null;
            index++;

            setTimeout(function(){
                if(mySequenceId === audioSequenceId){
                    next();
                }
            }, 300);
        }

        currentAudio.onended = function(){
            finishClip();
        };

        currentAudio.onerror = function(){
            finishClip('Missing audio:');
        };

        currentAudio.play().catch(function(error){
            console.log('Playback error:', file, error);
            finishClip('Unable to play audio:');
        });
    }

    next();
}
function playQuestionAudio(){
    if(
        currentIndex < 0 ||
        currentIndex >= questions.length
    ){
        return;
    }

    var qNo = currentIndex + 1;
    var q = questions[currentIndex];
    var files = [];

    files.push(
        'q' + qNo +
        '/q' + qNo +
        '.mp3'
    );

    for(var i = 0; i < q.options.length; i++){
        files.push(
            'q' + qNo +
            '/q' + qNo +
            ' o' + (i + 1) +
            '.mp3'
        );
    }

    playAudioSequence(files);
}

  /* ═══════════════════ DOM REFS ═══════════════════ */
  var elOverlay      = document.getElementById('speech-overlay');
  var elProgressTxt  = document.getElementById('progress-text');
  var elProgressBar  = document.getElementById('progress-bar-fill');
  var elQNum         = document.getElementById('question-number');
  var elQText        = document.getElementById('question-text');
  var elPrevBtn      = document.getElementById('prev-btn');
  var elReplay       = document.getElementById('replay-btn');
  var elExplainBtn   = document.getElementById('explain-btn');
  var elExplainPanel = document.getElementById('explanation-panel');
  var elExplainText  = document.getElementById('explain-text');
var elExplainListen =
    document.getElementById(
        'explain-listen-btn'
    );
  var elAnswers      = document.getElementById('answers-area');
  var elQuiz         = document.getElementById('quiz-area');
  var elResult       = document.getElementById('result-screen');
  var elResultMsg    = document.getElementById('result-msg');
  var elResultScore  = document.getElementById('result-scores');
  var elRestart      = document.getElementById('restart-btn');

  function openExplanation(){
    stopInactivityTimer();
    clearAllGlow();
    explanationOpen = true;
    elExplainPanel.style.display = 'block';
    elExplainBtn.classList.add('active');
    closeAllOptionExplanations();

    var qNo = currentIndex + 1;
    // 對應你的 GitHub 檔名格式：q1/q1 explain.mp3[cite: 12]
    playAudio('q' + qNo + '/q' + qNo + ' explain.mp3');
  }

  function closeExplanation(){
    explanationOpen = false;
    elExplainPanel.style.display = 'none';
    elExplainBtn.classList.remove('active');
  }

  function toggleExplanation(){
    if(explanationOpen){
        closeExplanation();
        stopAudio();

        setTimeout(function(){
            playQuestionAudio();
        }, 100);
    }else{
        openExplanation();
    }
}

  function toggleOptionExplanation(index){
    stopInactivityTimer();
    clearAllGlow();

    var panel =
        document.getElementById('opt-explain-' + index);

    var allExpBtns =
        elAnswers.querySelectorAll('.option-explain-btn');

    var btn = allExpBtns[index];

    if(panel && panel.style.display === 'block'){
        panel.style.display = 'none';

        if(btn){
            btn.classList.remove('active');
        }

        stopAudio();

        /*
         * Replay the question instead of starting the timer
         * while nothing is playing.
         */
        setTimeout(function(){
            playQuestionAudio();
        }, 100);
    }else{
        closeAllOptionExplanations();
        closeExplanation();

        if(panel){
            panel.style.display = 'block';
        }

        if(btn){
            btn.classList.add('active');
        }

        var qNo = currentIndex + 1;

        playAudio(
            'q' + qNo +
            '/q' + qNo +
            ' o' + (index + 1) +
            ' explain.mp3'
        );
    }
}

  function closeAllOptionExplanations(){
    var panels = elAnswers.querySelectorAll('.option-explain-panel');
    for(var i = 0; i < panels.length; i++) panels[i].style.display = 'none';
    var btns = elAnswers.querySelectorAll('.option-explain-btn');
    for(var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
  }

function renderQuestion(){
    stopInactivityTimer();
    locked = false;
    explanationOpen = false;
    stopAudio();
    var q = questions[currentIndex];

    elProgressTxt.textContent = '第 ' + (currentIndex + 1) + ' / 9 題';
    elProgressBar.style.width = ((currentIndex + 1) / 9 * 100) + '%';
    elQNum.textContent = '問題 ' + (currentIndex + 1);
    elQText.textContent = q.text;

    if(currentIndex > 0){
      elPrevBtn.style.display = 'inline-flex';
    } else {
      elPrevBtn.style.display = 'none';
    }

    elExplainPanel.style.display = 'none';
    elExplainBtn.classList.remove('active');
    elExplainText.textContent = q.explanation;

    elAnswers.innerHTML = '';

    var colorPalette = (q.options.length === 6) ? BTN_COLORS_6 : BTN_COLORS_5;

    q.options.forEach(function(opt, i){
      var colorClass = colorPalette[i % colorPalette.length];
      addScaleOption(opt, i, colorClass);
    });

window.scrollTo(0, 0);

playQuestionAudio();
  }

  function addScaleOption(opt, index, colorClass){
    var wrapper = document.createElement('div');
    wrapper.className = 'option-wrapper';

    var mainRow = document.createElement('div');
    mainRow.className = 'option-main-row';

    var btn = document.createElement('button');
    btn.className = 'answer-btn ' + colorClass;

    if(answers[currentIndex] !== undefined && answers[currentIndex] === opt.value){
      btn.classList.add('selected');
    }

    var ts = document.createElement('span');
    ts.textContent = opt.label;
    btn.appendChild(ts);
    btn.addEventListener('click', function(){ onAnswer(btn, opt.value); });
    mainRow.appendChild(btn);

    var optExpBtn = document.createElement('button');
    optExpBtn.className = 'option-explain-btn';
    optExpBtn.textContent = '💡 解釋';
    optExpBtn.addEventListener('click', function(){ toggleOptionExplanation(index); });
    mainRow.appendChild(optExpBtn);

    wrapper.appendChild(mainRow);

    var panel = document.createElement('div');
    panel.className = 'option-explain-panel';
    panel.id = 'opt-explain-' + index;

    var expText = document.createElement('div');
    expText.className = 'explain-text';
    expText.textContent = opt.explanation;
    panel.appendChild(expText);

    var listenBtn = document.createElement('button');
    listenBtn.className = 'explain-listen-btn';
    listenBtn.textContent = '🔊 再聽一次';
    listenBtn.addEventListener('click', function(){
      var qNo = currentIndex + 1;
      playAudio('q' + qNo + '/q' + qNo + ' o' + (index + 1) + ' explain.mp3');
    });
    panel.appendChild(listenBtn);

    wrapper.appendChild(panel);
    elAnswers.appendChild(wrapper);
  }

  function onAnswer(btn, value){
    stopInactivityTimer();
    if(locked) return;
    locked = true;
    stopAudio();

    var all = elAnswers.querySelectorAll('.answer-btn');
    for(var i = 0; i < all.length; i++) all[i].classList.add('locked');
    btn.classList.remove('locked');
    btn.classList.add('selected');

    var optBtns = elAnswers.querySelectorAll('.option-explain-btn');
    for(var i = 0; i < optBtns.length; i++) optBtns[i].style.pointerEvents = 'none';

    answers[currentIndex] = value;

    setTimeout(function(){
      currentIndex++;
      if(currentIndex < questions.length) renderQuestion();
      else showResult();
    }, 350);
  }

  function prevQuestion(){
    stopInactivityTimer();
    clearAllGlow();

    if(currentIndex <= 0)
        return;

    stopAudio();

    currentIndex--;

    renderQuestion();

}

  function showResult(){
    stopInactivityTimer();
    stopAudio();
    elQuiz.style.display = 'none';
    elResult.style.display = 'block';

    var totalScore = 0;
    var maxPossible = 36;
    skippedCount = 0;

    for(var key in answers){
      if(answers.hasOwnProperty(key)){
        var val = answers[key];
        if(val === 'skip'){
          skippedCount++;
        } else {
          totalScore += val;
        }
      }
    }

    var adjustedMax = maxPossible - (skippedCount * 4);
    if(adjustedMax < 1) adjustedMax = 1;

    var percentage = (totalScore / adjustedMax) * 100;
    var percentStr = percentage.toFixed(1) + '%';
    var scoreStr = totalScore + ' / ' + adjustedMax;

    elResultMsg.textContent =
      '非常感謝您完成了這份調查中所有的問題。' +
      '請勿關閉此頁面，並告知您的物理治療師。';

    elResultScore.innerHTML =
  '<span>總得分: ' + scoreStr + '</span>' +
  '<span>百分比: ' + percentStr + '</span>' +
  (skippedCount > 0 ? '<span style="font-size:1.2rem;color:#e74c3c;">(已略過第9題駕駛題)</span>' : '');

window.scrollTo(0, 0);

// result.mp3 is in the same GitHub folder as index.html
playAudio('result.mp3');
  }

function restart(){
    stopInactivityTimer();
    stopAudio();
    startQuiz();
}

  function init(){
    elOverlay.addEventListener('click', onOverlayTap);
    elPrevBtn.addEventListener('click', prevQuestion);
    elReplay.addEventListener('click', function(){
    stopInactivityTimer();
    closeExplanation();
    closeAllOptionExplanations();
    playQuestionAudio();
});
    elExplainBtn.addEventListener('click', function(){
      toggleExplanation();
    });
    elExplainListen.addEventListener('click', function(){
    stopInactivityTimer();

    var qNo = currentIndex + 1;

    playAudio(
        'q' + qNo +
        '/q' + qNo +
        ' explain.mp3'
    );
});
    elRestart.addEventListener('click', restart);
  }

  function onOverlayTap(){
    audioEnabled = true;
    elOverlay.style.display = 'none';
    startQuiz();
  }

  function startQuiz(){
    currentIndex = 0;
    answers = {};
    skippedCount = 0;
    elResult.style.display = 'none';
    elQuiz.style.display = 'flex';
    renderQuestion();
  }

  init();
})();
</script>
